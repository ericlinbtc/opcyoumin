name: Release immutable image

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      confirmation:
        description: Type the selected environment name to confirm the release
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require selected confirmation and successful CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          test "$CONFIRMATION" = "$TARGET_ENVIRONMENT"
          if [ "$TARGET_ENVIRONMENT" = production ]; then test "$RELEASE_REF" = main; fi
          verify_count="$(gh api "repos/$REPOSITORY/commits/$RELEASE_SHA/check-runs" --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success")] | length')"
          infra_count="$(gh api "repos/$REPOSITORY/commits/$RELEASE_SHA/check-runs" --jq '[.check_runs[] | select(.name == "infrastructure-and-images" and .conclusion == "success")] | length')"
          test "$verify_count" -gt 0
          test "$infra_count" -gt 0

  build-and-push:
    needs: source-gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile
          - component: worker
            dockerfile: Dockerfile.worker
    steps:
      - name: Validate explicit confirmation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          test "$CONFIRMATION" = "$TARGET_ENVIRONMENT"
          node -e "const v=process.env.ACTION_KEY||''; const bytes=Buffer.from(v,'base64'); if (!/^[A-Za-z0-9+/]+={0,2}$/.test(v) || ![16,24,32].includes(bytes.length)) process.exit(1)"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/youmin-${{ matrix.component }}:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          secrets: next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - name: Scan HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/work"
          aquasec/trivy:0.74.0 image
          --exit-code 1 --severity HIGH,CRITICAL --format json
          --output /work/trivy-${{ matrix.component }}.json
          local/youmin-${{ matrix.component }}:${{ github.sha }}
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.component }}-${{ github.sha }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Push immutable image with provenance
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/youmin/${{ matrix.component }}:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          secrets: next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          provenance: true
          sbom: true
      - name: Release summary
        run: |
          echo "image=${{ secrets.ACR_REGISTRY }}/youmin/${{ matrix.component }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "environment=${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
