name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: youmin
          POSTGRES_PASSWORD: youmin
          POSTGRES_DB: youmin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U youmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_URL: http://127.0.0.1:3001
      DATABASE_URL: postgres://youmin:youmin@127.0.0.1:5432/youmin
      REDIS_URL: redis://127.0.0.1:6379
      SMS_DEV_CODE: '246810'
      SESSION_SIGNING_SECRET: ci-session-signing-secret-at-least-32-characters
      PHONE_ENCRYPTION_KEY: ci-phone-encryption-key-at-least-32-characters
      PHONE_HASH_PEPPER: ci-phone-hash-pepper-at-least-32-characters
      REQUEST_IP_HASH_PEPPER: ci-request-ip-pepper-at-least-32-characters
      ALIYUN_ACCESS_KEY_ID: ci-oss-access-key-id
      ALIYUN_ACCESS_KEY_SECRET: ci-oss-access-key-secret-at-least-32-characters
      ALIYUN_OSS_REGION: oss-cn-hangzhou
      ALIYUN_OSS_BUCKET: ci-youmin-media
      MEDIA_PUBLIC_BASE_URL: https://media-ci.example.com
      SEED_DEMO_CONTENT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high --prod

  infrastructure-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Validate k6 script
        run: docker run --rm -v "$PWD:/work" -w /work grafana/k6:2.2.0 inspect -e LOAD_PROFILE=release -e LOAD_TEST_SECRET=ci-load-test-secret-at-least-32-characters tests/load/community-smoke.js
      - name: Build production images
        run: |
          docker build --tag youmin-web:ci --file Dockerfile .
          docker build --tag youmin-worker:ci --file Dockerfile.worker .
